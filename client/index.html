<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <script>
    // Cap the WebGL render resolution on high-DPR (mobile) displays, BEFORE wasm
    // boots. winit-web sizes the canvas backing store to CSS-size × devicePixelRatio,
    // so an iPhone (dpr ~3) renders ~9× the CSS pixels and iOS Safari's GPU governor
    // throttles hard (measured on bad-spaceship). Spoofing devicePixelRatio is what
    // winit actually reads; Bevy's scale_factor_override is a no-op on web. For a 2D
    // sprite game 1.5 is plenty sharp; tune down if phones still throttle.
    (function () {
      var MAX_DPR = 1.5;
      var real = window.devicePixelRatio || 1;
      if (real > MAX_DPR) {
        try {
          Object.defineProperty(window, 'devicePixelRatio',
            { get: function () { return MAX_DPR; }, configurable: true });
        } catch (e) {}
      }
    })();
  </script>
  <meta name="viewport"
    content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <title>Army Ghosts</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #101408;
      overflow: hidden;
      /* No pull-to-refresh / overscroll bounce while dragging the joystick. */
      overscroll-behavior: none;
    }

    /* Size the canvas to fill the viewport via CSS (the renderer tracks the
       canvas's CSS size). touch-action:none so drags drive the game, not the
       browser. */
    canvas {
      display: block;
      touch-action: none;
      width: 100% !important;
      height: 100% !important;
      outline: none;
      -webkit-user-select: none;
      user-select: none;
    }

    /* Lightweight loading overlay shown instantly while the WASM binary
       streams in. Pure inline CSS, no external requests. */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.1rem;
      background: #101408;
      color: #d8e6c0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      transition: opacity 0.45s ease;
    }

    #loader.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #title {
      font-size: 1.5rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: #9fc06a;
    }

    #bar-outer {
      width: min(70vw, 440px);
      height: 14px;
      border: 1px solid #4a5a2e;
      border-radius: 8px;
      background: #1a2210;
      overflow: hidden;
    }

    #bar-inner {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #5a7a30, #9fc06a);
      transition: width 0.15s linear;
    }

    /* Used when the total size is unknown (no content-length): sweep the bar
       instead of reporting a bogus percentage. */
    #bar-inner.indeterminate {
      width: 35% !important;
      transition: none;
      animation: sweep 1.1s ease-in-out infinite alternate;
    }

    @keyframes sweep {
      from { margin-left: 0%; }
      to { margin-left: 65%; }
    }

    #status {
      font-size: 0.95rem;
      min-height: 1.2em;
    }

    #eta {
      font-size: 0.8rem;
      color: #7a8a5e;
      min-height: 1.1em;
    }

    #room {
      font-size: 0.8rem;
      color: #7a8a5e;
      min-height: 1.1em;
      letter-spacing: 0.08em;
    }
  </style>
</head>

<body>
  <div id="loader">
    <div id="title">Army Ghosts</div>
    <div id="bar-outer">
      <div id="bar-inner"></div>
    </div>
    <div id="status">Loading…</div>
    <div id="eta">estimating…</div>
    <div id="room"></div>
  </div>

  <script>
    // Connection info, parsed from the join link BEFORE wasm init so the
    // client can read it synchronously on boot:
    //   ?room=CODE      join/create this matchbox room (absent → local mode)
    //   ?players=N      seat cap, max 8 (default 8) — the host starts the
    //                   match with whoever's present; a full room auto-starts
    //   ?signaling=URL  override the signaling server (testing)
    //   ?bots=N         start with N bots (the MENU has -/+ for it too, and
    //                   both feed the same dial)
    //   ?aggro=PCT      how hard the bots push, 0-100 (MENU has -/+ too).
    //                   Snapped to the nearest of the dial's 11 positions.
    //   ?ice=none       host-candidates-only (fast local/LAN testing; some
    //                   networks stall browser STUN for ~40s per handshake);
    //                   or ?ice=stun:host:port,... for custom servers
    // Default signaling: same host as the page over wss on port 3536 for
    // localhost dev, or the standard tailscale-served port for phones —
    // refined when the Mac serving setup lands; ?signaling= always wins.
    (function () {
      const p = new URLSearchParams(location.search);
      const room = p.get('room') || '';
      const players = p.get('players') || '';
      const bots = p.get('bots') || '';
      const aggro = p.get('aggro') || '';
      const ice = p.get('ice') || '';
      // Dev measuring rig, offline only (net.rs ignores it with a room set):
      // ?scenario=strip[:depth[:east stance]] — see sim's `Scenario`.
      const scenario = p.get('scenario') || '';
      // Plain-http origins (localhost dev, or a LAN IP for same-wifi phones
      // that can't hairpin to the public URL): direct ws:// to matchbox.
      const isPlainWs = /^(localhost|127\.|192\.168\.|10\.|172\.(1[6-9]|2\d|3[01])\.)/.test(location.hostname);
      // Tailscale-served dev builds: the signaling server rides the same
      // MagicDNS host on HTTPS port 9451 (tailscale serve → 127.0.0.1:3536).
      const isTailnet = /\.ts\.net$/.test(location.hostname);
      // The Mac's caddy vhost: same-origin path-based signaling at /ws/<room>
      // (caddy handle_path strips the prefix before matchbox_server sees it).
      const isCaddy = /whoeverwants\.com$/.test(location.hostname);
      // Anywhere else (GitHub Pages): the page is static-hosted far from the
      // signaling server, so point at the Mac's public endpoint directly.
      const signaling = p.get('signaling') ||
        (isPlainWs ? 'ws://' + location.hostname + ':3536'
         : isTailnet ? 'wss://' + location.hostname + ':9451'
         : isCaddy ? 'wss://' + location.host + '/ws'
                   : 'wss://army-ghosts.dev.whoeverwants.com:7443/ws');
      window.__AG_NET__ = { room, players, bots, aggro, signaling, ice, scenario };
      if (room) {
        document.getElementById('room').textContent =
          'multiplayer · room ' + room + (players ? ' · ' + players + ' players' : '');
      }
    })();
  </script>

  <script type="module">
    import init from './target/wasm.js';

    const loader = document.getElementById('loader');
    const barInner = document.getElementById('bar-inner');
    const statusEl = document.getElementById('status');
    const etaEl = document.getElementById('eta');

    const WASM_URL = './target/wasm_bg.wasm';

    const fmtBytes = (n) => {
      if (n >= 1048576) return (n / 1048576).toFixed(1) + ' MB';
      if (n >= 1024) return (n / 1024).toFixed(0) + ' KB';
      return Math.round(n) + ' B';
    };

    const fmtTime = (s) => {
      if (!isFinite(s) || s < 0) return '—';
      s = Math.ceil(s);
      if (s < 60) return s + 's';
      return Math.floor(s / 60) + 'm ' + (s % 60).toString().padStart(2, '0') + 's';
    };

    // Authoritative sizes from the build (loader-manifest.json). `wasm_bytes`
    // is the uncompressed size — the honest progress denominator, because the
    // fetch stream below yields DECOMPRESSED bytes while on-the-fly
    // compressing hosts (GitHub Pages, caddy encode) send no usable
    // Content-Length. `wasm_wire_bytes` is a build-time gzip estimate of what
    // actually crosses the network — the size the labels display. Absent on
    // bare local builds (falls back to Content-Length / indeterminate).
    async function loadManifest() {
      try {
        const r = await fetch('./loader-manifest.json', { cache: 'no-cache' });
        if (!r.ok) return null;
        return await r.json();
      } catch (_) {
        return null;
      }
    }

    async function run() {
      // Fetch the manifest and the wasm together — the heavy download starts
      // streaming immediately instead of waiting a round-trip for the tiny
      // manifest.
      const [manifest, response] = await Promise.all([loadManifest(), fetch(WASM_URL)]);
      if (!response.ok) throw new Error(`${WASM_URL} → HTTP ${response.status}`);

      const encoded = !!response.headers.get('content-encoding');
      const clRaw = response.headers.get('content-length');
      const cl = clRaw ? parseInt(clRaw, 10) : 0;
      // Progress fraction denominator: decompressed bytes.
      const total = (manifest && manifest.wasm_bytes) || (encoded ? 0 : cl);
      // Displayed download size: Content-Length is the wire size whenever
      // present (compressed or not); otherwise the manifest's build-time gzip
      // estimate; otherwise the uncompressed total.
      const wireTotal =
        cl || (encoded ? (manifest && manifest.wasm_wire_bytes) || 0 : 0) || total;

      const start = performance.now();
      let loaded = 0;

      const render = () => {
        const determinate = total > 0;
        barInner.classList.toggle('indeterminate', !determinate);
        if (determinate) {
          const frac = Math.min(loaded / total, 1);
          const pct = Math.floor(frac * 100);
          barInner.style.width = pct + '%';
          // Labels report the wire download scaled by the honest fraction.
          statusEl.textContent =
            `Loading… ${pct}%  (${fmtBytes(frac * wireTotal)} / ${fmtBytes(wireTotal)})`;
          const elapsed = (performance.now() - start) / 1000;
          if (frac >= 1) {
            etaEl.textContent = '';
          } else if (frac > 0.005 && elapsed > 0.3) {
            etaEl.textContent = `ETA ${fmtTime(elapsed * (1 - frac) / frac)}`;
          } else {
            etaEl.textContent = 'estimating…';
          }
        } else {
          statusEl.textContent = `Loading… ${fmtBytes(loaded)}`;
          etaEl.textContent = '';
        }
      };

      // Coalesce per-chunk progress into at most one DOM update per frame.
      let renderQueued = false;
      const scheduleRender = () => {
        if (renderQueued) return;
        renderQueued = true;
        requestAnimationFrame(() => {
          renderQueued = false;
          render();
        });
      };
      render();

      const reader = response.body.getReader();
      const chunks = [];
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        loaded += value.byteLength;
        scheduleRender();
      }
      loaded = total || loaded;
      render();
      barInner.classList.remove('indeterminate');
      barInner.style.width = '100%';

      statusEl.textContent = 'Starting…';
      etaEl.textContent = '';
      const wasmModule = await WebAssembly.compile(await new Blob(chunks).arrayBuffer());
      try {
        await init(wasmModule);
      } catch (e) {
        // Bevy's winit loop exits init() by throwing a sentinel exception to
        // unwind the Rust stack while the app keeps running. Not a real error.
        const msg = (e && e.message) || '';
        if (!msg.startsWith('Using exceptions for control flow')) throw e;
      }

      // init() returns as soon as the module starts; Bevy then loads assets
      // and compiles render pipelines before anything is drawn. Hiding now
      // would cut to a blank canvas, so wait for the game's ready signal
      // (<body data-game-ready>, set once frames are actually rendering) with
      // a timeout so the loader can never get stuck.
      const readyStart = performance.now();
      (function hideWhenReady() {
        const ready = document.body.getAttribute('data-game-ready') === '1';
        if (ready || performance.now() - readyStart > 15000) {
          loader.classList.add('hidden');
          setTimeout(() => loader.remove(), 500);
        } else {
          requestAnimationFrame(hideWhenReady);
        }
      })();
    }

    run().catch((e) => {
      console.error(e);
      barInner.classList.remove('indeterminate');
      barInner.style.background = '#c05b4d';
      barInner.style.width = '100%';
      statusEl.textContent = 'Failed to load';
      etaEl.textContent = '';
      document.getElementById('room').textContent = String((e && e.message) || e);
    });
  </script>

  <script>
    // iOS tab-suspension recovery (bad-spaceship lesson): a heavy wasm/WebGL
    // tab backgrounded on iOS almost always has its loop or GPU context torn
    // down and cannot be revived in place — reload instead. With rollback p2p
    // there is no server to resume from yet; the reload simply rejoins.
    (function () {
      let hiddenAt = 0;
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') {
          hiddenAt = performance.now();
        } else if (hiddenAt && performance.now() - hiddenAt > 3000) {
          location.reload();
        }
      });
    })();
  </script>
</body>

</html>
